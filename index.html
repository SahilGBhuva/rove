<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
  <title>Rove | Bay Area Transit</title>
  <meta name="description" content="Door-to-door transit directions and live times for the San Francisco Bay Area: BART, Muni, Caltrain, VTA, and AC Transit." />
  <link rel="preload" href="public/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <a class="skip-link" href="#panelBody">Skip to transit information</a>

  <main class="map-area" aria-label="Map">
    <div id="map" class="map" role="region" aria-label="Interactive map of Bay Area transit lines and stops"></div>
    <div class="map-loading" id="mapLoading" role="status"><span class="spinner" aria-hidden="true"></span><span>Loading the Bay Area transit network</span></div>
  </main>

  <aside class="panel" id="panel" aria-label="Transit information">
    <div class="sheet-grabber" id="sheetGrabber" role="button" tabindex="0" aria-label="Resize panel. Use the up and down arrow keys."><span></span></div>
    <header class="panel-top">
      <div class="brand-row">
        <span class="wordmark" aria-label="Rove">rove</span>
        <button class="icon-button" id="menuButton" aria-haspopup="menu" aria-expanded="false" aria-label="More options">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/></svg>
        </button>
      </div>
      <div class="search-field" role="search">
        <svg class="search-glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.6 12.6 17 17"/></svg>
        <input id="searchInput" type="search" placeholder="Search places, stops, and lines" autocomplete="off" spellcheck="false" aria-label="Search places, stops, and lines" aria-controls="panelBody" />
        <button class="search-clear" id="searchClear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
        </button>
      </div>
    </header>
    <div class="panel-body" id="panelBody" tabindex="-1" aria-live="polite"></div>
  </aside>

  <div class="menu" id="menu" role="menu" hidden>
    <button role="menuitem" data-menu="lines">All lines</button>
    <button role="menuitem" data-menu="intro">Show the introduction</button>
    <button role="menuitem" data-menu="sources">Data sources and credits</button>
  </div>

  <div class="map-controls" id="mapControls">
    <div class="control-group desktop-only">
      <button id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
      <button id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button>
    </div>
    <div class="control-group">
      <button id="locateButton" aria-label="Show my location"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 16.5 16 10 12.8 3.5 16Z" transform="rotate(45 10 10)"/></svg></button>
      <button id="layersButton" aria-label="Map layers" aria-expanded="false" aria-controls="layersPopover"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3 18 7.5 10 12 2 7.5Z"/><path d="M2 11.5 10 16l8-4.5"/></svg></button>
    </div>
  </div>

  <section class="layers-popover" id="layersPopover" aria-label="Map layers" hidden>
    <div class="popover-head"><h2>Map</h2><button class="icon-button" id="layersClose" aria-label="Close map layers"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg></button></div>
    <div class="segmented" role="radiogroup" aria-label="Map style">
      <button role="radio" data-map-mode="standard">Standard</button>
      <button role="radio" data-map-mode="satellite">Satellite</button>
      <button role="radio" data-map-mode="dark">Dark</button>
    </div>
    <h3 class="label">Agencies</h3>
    <div id="agencyToggles" class="toggle-list"></div>
    <h3 class="label">Show</h3>
    <div class="toggle-list">
      <label class="toggle-row"><span>Live vehicles</span><input type="checkbox" id="vehiclesToggle" checked /><i aria-hidden="true"></i></label>
    </div>
  </section>

  <div class="intro" id="intro" role="dialog" aria-modal="false" aria-labelledby="introTitle" hidden>
    <p class="intro-step" id="introStep"></p>
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
    <div class="intro-actions">
      <button class="text-button" id="introSkip">Skip</button>
      <button class="button primary" id="introNext">Next</button>
    </div>
  </div>

  <div class="map-pick" id="mapPick" role="status" hidden>
    <span id="mapPickText">Tap the map to set the destination.</span>
    <button class="text-button" id="mapPickCancel">Cancel</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
